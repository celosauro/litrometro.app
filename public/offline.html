<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Litrômetro | Sem conexão</title>
    <style>
      :root {
        --brand: #1a4d2e;
        --bg: #f5f7f6;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #e7f3eb 0%, var(--bg) 55%);
        color: var(--text);
      }

      main {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid #d1d5db;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 10px;
        color: var(--muted);
      }

      .actions {
        margin-top: 20px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button,
      a {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.95rem;
        text-decoration: none;
        cursor: pointer;
      }

      button {
        background: var(--brand);
        color: #fff;
      }

      a {
        background: #e5e7eb;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>Não foi possível carregar dados novos agora.</p>
      <p>Quando a internet voltar, recarregue a página para atualizar preços e mapa.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <a href="/">Voltar para início</a>
      </div>
    </main>
  </body>
</html>
